  {% extends 'base/shortbase.html' %} 

   {% block start %}
    <div class="container bg-white">
      <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
          <br><p style="font-style: italic; font-weight: bold; font-family: Arial; color: rgba(77, 70, 70, 0.726);">
            We have sent a 6 digit OTP in email {{email}} 
          </p>
          <form action="{% url 'forget_password_verify_code_page' %}" method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-4">OTP</div>
                <div class="col-8">
                  <input type="number" name="OTP" id="" class="form-control">
                </div>
                <div class="col-4"><input type="hidden" name="email" value="{{email}}"></div>
                <div class="col-8"><br>
                  <button type="submit" class="btn btn-primary">enter Email</button>
                  <br></div>
            </div>
          </form>
        </div>
        <div class="col-3"></div>
      </div>
    </div>

   {% endblock %}
