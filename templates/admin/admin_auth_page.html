<html>
<head>

    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <title>Sulli.com</title>
    <style>
        
    .input-container input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid transparent;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 0 0 2px #ccc;
      transition: 0.3s ease;
      font-size: 16px;
      outline: none;
      margin-top: 10px;
    }

    .input-container input:focus {
      box-shadow: 0 0 0 2px #6c63ff;
      border-color: #6c63ff;
    }

    .input-container input::placeholder {
      color: #aaa;
      transition: 0.2s;
    }

    .input-container input:focus::placeholder {
      opacity: 0.6;
    }
    


    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.3);
    }

    .toggle-eye {
      position: relative;
      bottom: 40px;
      left: 90%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #888;
    }

    .toggle-eye:hover {
      color: #6c63ff;
    }
    .heading{
        font-size: 30px;
        font-weight: bold;
        padding: 10px 0px 10px 0px ;
    }
  
    </style>
</head>
<body>
    <form action="" method="post">
              {% csrf_token %}

    <div class="container">
        <div class="row">
            
            <div class="col0-12">
                <center><div class="heading">Admin Authentication</div></center>
            </div>
            <div class="col-4">username</div>
            <div class="col-8">  
                <div class="input-container">
                <input type="email" name="email" placeholder="Enter your username">
                 </div>
           </div> 
            <div class="col-4">password</div>
            <div class="col-8">
                  <div class="input-container">
                <input type="password" id="password" name="password" placeholder="Enter your password">
                <span class="toggle-eye" onclick="togglePassword()">👁</span>
                 </div>
            </div>
            
           <div class="col-md-10 col-sm-8">
            <div class="row">
                <div class="col-md-10 col-sm-8">
                  {% if errors %}
                  <div class="alert alert-warning">
                  write all errors here
                  </div>
                  {% endif %}
                </div>
            <div class="col-md-2 col-sm-4"><button type="submit" class="btn btn-primary" style="width: 100%;">login</button></div>
            
            </div>
           </div>
            <div class="col-md-2 col-sm-4"><a href="{% url 'emailforcode' %}">forget password</a></div>
          
        </div>
    </div>
      </form>
</body>
 <script>
    function togglePassword() {
      const input = document.getElementById("password");
      const icon = document.querySelector(".toggle-eye");

      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "X"; // Change icon
      } 
      else {
        input.type = "password";
        icon.textContent = "👁"; // Change back
      }
    }
    
  </script>
</html>
