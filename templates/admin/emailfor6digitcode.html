<html>
<head>

    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <title>Sulli.com</title>
    <style>
        
    .input-container input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid transparent;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 0 0 2px #ccc;
      transition: 0.3s ease;
      font-size: 16px;
      outline: none;
      margin-top: 10px;
    }

    .input-container input:focus {
      box-shadow: 0 0 0 2px #6c63ff;
      border-color: #6c63ff;
    }

    .input-container input::placeholder {
      color: #aaa;
      transition: 0.2s;
    }

    .input-container input:focus::placeholder {
      opacity: 0.6;
    }
    


    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.3);
    }

    .heading{
        font-size: 30px;
        font-weight: bold;
        padding: 10px 0px 10px 0px ;
    }
  
    </style>
</head>
<body> 
    <form action="" method="post">
              {% csrf_token %}

    <div class="container">
        <div class="row">
            <div class="col0-12">
                <center><div class="heading">Admin Authentication</div></center>
            </div>
            <div class="col-4">Email address</div>
            <div class="col-8">  
                <div class="input-container">
                <input type="email" name="email" required placeholder="Enter your email address">
                </div>
           </div> <div class="col-4">Date Of Birth</div>
            <div class="col-8">  
                <div class="input-container">
                <input type="date" name="DOB" required placeholder="Enter your date of birth">
                </div>
           </div> 
          <div class="col-md-10 col-sm-8"></div>
          <div class="col-md-2 col-sm-4"><button class="btn btn-outline-primary mt-2">Next</button></div>
           
            
        </div>
    </div>
    </form>
</body>
</html>
