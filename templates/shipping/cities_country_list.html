    {% extends 'base/shortbase.html' %} 
    {% block start %}
        <div class="container bg-white" style="border-radius: 10px;">
            <div class="row">

                    <div class="col-md-6 col-sm-12">
                        <form action="" method="post">
                            {% csrf_token %}
                            <div class="row border border-2">
                                <div class="col-4">
                                   <br>
                                    Country name
                                </div>
                                <div class="col-8">
                                    <br><input type="text" name="country" id="" class="form-control">
                                    <input type="hidden" name="form_type" value="country_form">
                                </div>
                                <div class="col-4"></div>
                                <div class="col-8">
                                    <br><button type="submit" style="width: 100%;" class="btn btn-outline-primary">add country</button><br><br>
                                </div>
                            </div>
                            </form>
                    </div>
                    <div class="col-md-6 col-sm-12">
                        <form action="" method="post">
                            {% csrf_token %}
                        <div class="row border border-2">
                                                        <div class="col-4">
                                                        <br>
                                                            City name
                                                        </div>
                                                        <div class="col-8">
                                                            <br><input type="text" name="city" id="" class="form-control">
                                                            <input type="hidden" name="form_type" value="city_form">
                                                        </div>
                                                        <div class="col-4"></div>
                                                        <div class="col-8">
                                                            <br><button type="submit" style="width: 100%;" class="btn btn-outline-primary">add city</button><br><br>
                                                        </div>
                            </div>
                            </form>
                    </div>
            </div>
        </div>
        <br>
        <div class="container bg-white" style="border-radius: 10px;">
            <div class="row">
                <div class="col-6">
                     <center>
                        <br><p style="font-size: 16px; color: #3e3b3b; font-family: Arial, sans-serif;font-weight: bold; ">Country</p>
                     </center>   
                     <div class="row">
                        <div class="col-3"></div>
                        <div class="col-6 border border-2 bg-light" style="border-radius: 5px;">
                                {% if country %}
                                <div class="row">
                                    <div class="col-6">
                                        {{country.country_name}} 
                                    </div>
                                    <div class="col-3"><a href="{% url 'update_countries' country.id %}" style="text-decoration: none;">&#9881</a>
                                    </div>
                                    <div class="col-3">
                                        <a href="{% url 'delete_countries' country.id %}" style="text-decoration: none;">&#128465;</a>
                                    </div>
                                </div>
                                {% endif %}
                        </div>
                        <div class="col-3"></div>
                     </div>
                     <br>
                </div>
                
                    
                
                <div class="col-6">
                    <center>
                        <br><p style="font-size: 16px; color: #3e3b3b; font-family: Arial, sans-serif;font-weight: bold; ">Cities List</p>
                     </center>  
                    <div class="row">
                        {% for c in cities %}
                        <div class="col-3"></div>
                        <div class="col-6 border border-2 bg-light" style="border-radius: 5px;">
                                <div class="row">
                                    <div class="col-6">
                                        {{c.city_name}}
                                    </div>
                                    <div class="col-3"><a href="{% url 'update_cities' c.id %}" style="text-decoration: none;">&#9881</a>
                                    </div>
                                    <div class="col-3">
                                        <a href="{% url 'delete_cities' c.id %}" style="text-decoration: none;">&#128465;</a>
                                    </div>
                                </div>
                                
                        </div>
                        <div class="col-3"></div>
                        {% endfor %}
                     </div>
                     <br>
                </div>

            </div>
        </div>
   {% endblock %}
